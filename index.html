<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder Warrior</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: none; 
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        /* On-Screen Controls Container */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 5;
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Action Buttons Styles */
        .control-btn {
            pointer-events: auto;
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            font-size: 24px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: none;
        }

        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.7);
        }

        #btnShoot {
            background-color: rgba(241, 196, 15, 0.6);
            border-color: rgba(241, 196, 15, 1);
        }

        #btnShoot:active {
            background-color: rgba(241, 196, 15, 0.9);
        }

        /* Pause Button */
        #btnPause {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none; 
            background-color: rgba(44, 62, 80, 0.8);
            border: 2px solid #f1c40f;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: background-color 0.2s;
            z-index: 6;
            pointer-events: auto;
        }

        #btnPause:hover {
            background-color: #34495e;
        }

        /* Shop UI */
        #shopUI {
            position: absolute;
            top: 70px;
            right: 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
            pointer-events: auto;
        }

        .shop-btn {
            background-color: rgba(44, 62, 80, 0.8);
            border: 2px solid #f1c40f;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: background-color 0.2s, opacity 0.2s;
        }

        .shop-btn:active:not(.disabled) {
            background-color: rgba(241, 196, 15, 0.8);
            color: black;
        }

        .shop-btn.disabled {
            opacity: 0.5;
            border-color: #7f8c8d;
            cursor: not-allowed;
        }

        /* Start Screen UI Overlay */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(30, 42, 56, 0.96), rgba(15, 22, 36, 0.96));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }

        #startScreen h1 {
            color: #ffd700;
            font-size: 52px;
            font-weight: 900;
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 
                0 3px 0 #b33939, 
                0 6px 0 #8b0000, 
                0 8px 20px rgba(179, 57, 57, 0.8);
            animation: bounceTitle 1.2s infinite ease-in-out;
        }

        @keyframes bounceTitle {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.04); }
        }

        #instructions {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 12px 22px;
            border-radius: 10px;
            margin-bottom: 25px;
            margin-top: 20px;
            color: #ecf0f1;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        #instructions p {
            margin: 5px 0;
        }

        #audioPrompt {
            color: #bdc3c7;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            animation: pulseText 1.5s infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Character Selection UI */
        .character-select-title {
            color: white;
            font-size: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .character-select-container {
            display: flex;
            gap: 25px;
        }

        .char-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: rgba(44, 62, 80, 0.8);
            border: 3px solid #f1c40f;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .char-btn:hover {
            transform: scale(1.05);
            background-color: #34495e;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.6);
        }

        .char-canvas {
            margin-bottom: 10px;
            animation: swordPulse 1.4s infinite alternate ease-in-out;
        }

        @keyframes swordPulse {
            0% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 5px #f1c40f); }
            100% { transform: scale(1.15) rotate(5deg); filter: drop-shadow(0 0 15px #f39c12); }
        }

        /* Game Over UI Overlay */
        #gameOverUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 20;
            overflow: hidden;
        }

        #gameOverUI h1 {
            color: #ff4757;
            font-size: 52px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            transition: color 0.3s;
            z-index: 2;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            z-index: 2;
            margin-bottom: 15px;
        }

        #gameOverUI button {
            padding: 12px 24px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #2ed573;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }

        #gameOverUI button:hover {
            background-color: #27ae60;
        }

        #gameOverUI #btnChangeChar {
            background-color: #3498db;
        }

        #gameOverUI #btnChangeChar:hover {
            background-color: #2980b9;
        }

        #heroQuote {
            color: #f1c40f;
            font-size: 32px;
            font-weight: 900;
            margin-top: 15px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.8), 0 0 15px rgba(241, 196, 15, 0.8);
            animation: bounceHeroic 1.5s infinite ease-in-out;
            z-index: 2;
        }

        @keyframes bounceHeroic {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.08); color: #fff200; text-shadow: 0 6px 12px rgba(0,0,0,0.8), 0 0 25px rgba(255, 242, 0, 1); }
        }

        .sparkle {
            position: absolute;
            font-size: 28px;
            pointer-events: none;
            animation: sparkleAnim 1.8s infinite ease-in-out alternate;
            z-index: 1;
        }
        @keyframes sparkleAnim {
            0% { transform: scale(0) rotate(0deg); opacity: 0; filter: drop-shadow(0 0 5px #f1c40f); }
            50% { opacity: 1; filter: drop-shadow(0 0 15px #f1c40f); }
            100% { transform: scale(1.5) rotate(180deg); opacity: 0; filter: drop-shadow(0 0 5px #f1c40f); }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Pause Button -->
    <button id="btnPause" onclick="togglePause()">⏸️ Pause</button>

    <!-- Shop Elements -->
    <div id="shopUI">
        <button id="btnMedkit" class="shop-btn" onclick="buyMedkit()">🏥 Medkit (50)</button>
        <button id="btnUpgrade" class="shop-btn" onclick="buyUpgrade()">🔥 Upgrade (50)</button>
    </div>
    
    <!-- Start Screen -->
    <div id="startScreen">
        <h1>Thunder Warrior</h1>
        
        <div id="instructions">
            <p><strong>Arrow Keys / ◀▶ Buttons:</strong> Move Left & Right</p>
            <p><strong>Space Bar / ▲ Button:</strong> Jump / Climb Buildings</p>
            <p><strong>Z Key / ⚡ Button:</strong> Fire Attack</p>
            <p>Buy upgrades from the shop & Watch out for acid pigs!</p>
        </div>

        <div class="character-select-title">- Select Your Hero -</div>
        <div class="character-select-container">
            <button class="char-btn" onclick="startGame('male')">
                <canvas id="previewMale" class="char-canvas" width="60" height="65"></canvas>
                Male Warrior
            </button>
            <button class="char-btn" onclick="startGame('female')">
                <canvas id="previewFemale" class="char-canvas" width="60" height="65"></canvas>
                Female Warrior
            </button>
        </div>
        
        <p id="audioPrompt">Tap anywhere to enable sound</p>
    </div>

    <!-- Controls -->
    <div id="controls">
        <div class="control-group">
            <div class="control-btn" id="btnLeft">◀</div>
            <div class="control-btn" id="btnRight">▶</div>
        </div>
        <div class="control-group">
            <div class="control-btn" id="btnShoot">⚡</div>
            <div class="control-btn" id="btnUp">▲</div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverUI">
        <h1>Game Over!</h1>
        <div class="action-buttons">
            <button onclick="restartGame()">Restart</button>
            <button id="btnChangeChar" onclick="goToCharacterSelect()">Change Character</button>
        </div>
        <p id="heroQuote">It's not the end until you quit</p>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameOverUI = document.getElementById('gameOverUI');
    const gameOverTitle = document.querySelector('#gameOverUI h1');
    const startScreen = document.getElementById('startScreen');
    const shopUI = document.getElementById('shopUI');
    const btnMedkit = document.getElementById('btnMedkit');
    const btnUpgrade = document.getElementById('btnUpgrade');
    const btnPause = document.getElementById('btnPause');
    const audioPrompt = document.getElementById('audioPrompt');

    // --- AUDIO SYSTEM (BGM + SFX) ---
    let audioCtx = null;
    let activeBgmInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if (audioPrompt) audioPrompt.style.display = 'none'; 
    }

    let audioUnlocked = false;
    document.addEventListener('pointerdown', function unlockAudio() {
        if (!audioUnlocked) {
            audioUnlocked = true;
            initAudio();
            if (!isGameStarted && !isGameOver) {
                startMenuBGM();
            }
            document.removeEventListener('pointerdown', unlockAudio);
        }
    });

    function makeDistortionCurve(amount) {
        let k = typeof amount === 'number' ? amount : 50,
            n_samples = 44100,
            curve = new Float32Array(n_samples),
            deg = Math.PI / 180,
            i = 0, x;
        for ( ; i < n_samples; ++i ) {
            x = i * 2 / n_samples - 1;
            curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
        }
        return curve;
    }

    function stopAllBGM() {
        if (activeBgmInterval) {
            clearInterval(activeBgmInterval);
            activeBgmInterval = null;
        }
    }

    function startMenuBGM() {
        initAudio();
        stopAllBGM();
        
        const notes = [130.81, 146.83, 130.81, 196.00]; 
        let step = 0;
        
        activeBgmInterval = setInterval(() => {
            if (isGameStarted) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                
                osc.frequency.setValueAtTime(notes[step], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                
                step = (step + 1) % notes.length;
            } catch(e) {}
        }, 600);
    }

    function startMainBGM() {
        initAudio();
        stopAllBGM();

        const notes = [82.41, 82.41, 98.00, 110.00, 82.41, 82.41, 73.42, 61.74];
        let step = 0;

        activeBgmInterval = setInterval(() => {
            if (isPaused || isGameOver) return;
            
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                let distortion = audioCtx.createWaveShaper();

                distortion.curve = makeDistortionCurve(400); 
                distortion.oversample = '4x';

                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(notes[step], audioCtx.currentTime);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

                osc.connect(distortion);
                distortion.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);

                step = (step + 1) % notes.length;
            } catch (e) {}
        }, 220); 
    }

    function playVictoryBGM() {
        initAudio();
        stopAllBGM();
        
        const notes = [523.25, 659.25, 783.99, 1046.50]; 
        let step = 0;
        
        activeBgmInterval = setInterval(() => {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                
                let noteIndex = step % 6; 
                let actualNote = noteIndex < 4 ? notes[noteIndex] : notes[6 - noteIndex];
                
                osc.frequency.setValueAtTime(actualNote, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                
                step++;
            } catch(e) {}
        }, 120); 
    }

    function playDefeatSound() {
        if (!audioCtx) return;
        try {
            let now = audioCtx.currentTime;
            
            const notes = [311.13, 277.18, 233.08]; 
            notes.forEach((freq, idx) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, now + idx * 0.3);
                gain.gain.setValueAtTime(0.2, now + idx * 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.3 + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.3); osc.stop(now + idx * 0.3 + 0.3);
            });

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(155.56, now + 0.9); 
            osc.frequency.exponentialRampToValueAtTime(70, now + 2.0); 
            gain.gain.setValueAtTime(0.25, now + 0.9);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
            
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now + 0.9); osc.stop(now + 2.0);
        } catch(e) {}
    }

    // NEW SFX: COIN COLLECTION SOUND (Retro Two-Tone Chime)
    function playCoinSound() {
        if (!audioCtx) return;
        try {
            let now = audioCtx.currentTime;
            // High B5 -> E6 classic arcade coin chime
            [987.77, 1318.51].forEach((freq, idx) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.08);
                osc.stop(now + idx * 0.08 + 0.15);
            });
        } catch (e) {}
    }

    function playJumpSound() {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    function playShootSound() {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    function playHealSound() {
        if (!audioCtx) return;
        try {
            let now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                gain.gain.setValueAtTime(0.2, now + idx * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.06);
                osc.stop(now + idx * 0.06 + 0.2);
            });
        } catch (e) {}
    }

    function playUpgradeSound() {
        if (!audioCtx) return;
        try {
            let now = audioCtx.currentTime;
            [220, 330, 440, 660, 880].forEach((freq, idx) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                gain.gain.setValueAtTime(0.25, now + idx * 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.05 + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.05);
                osc.stop(now + idx * 0.05 + 0.25);
            });
        } catch (e) {}
    }

    function playKillSound() {
        if (!audioCtx) return;
        try {
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            let distortion = audioCtx.createWaveShaper();
            distortion.curve = makeDistortionCurve(300);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

            osc.connect(distortion);
            distortion.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.2);
        } catch (e) {}
    }

    // Game constants
    const GRAVITY = 0.6;
    const GROUND_HEIGHT = 50;
    
    let gameLoopId;
    let isGameStarted = false;
    let isGameOver = false;
    let isPaused = false;
    let score = 0;
    let coinCount = 0;
    let enemiesKilledCount = 0;
    let bgScroll = 0;
    let frames = 0;
    
    // Upgrades
    let hasUpgradedWeapon = false;
    let enemySpawnTimer = 60; 

    // Finish line variables
    let TIME_LIMIT_FRAMES = 7200; 
    let finishLineSpawned = false;
    let finishLine = null;

    // Start Animation Variables
    let startAnimTimer = 60; 
    let isStarting = true;

    // Player object 
    const player = {
        x: 100, 
        y: 50,  
        width: 24,
        height: 48,
        vx: 0,
        vy: 0,
        speed: 5,
        jumpForce: -12, 
        isGrounded: false,
        facing: 'right',
        health: 100,
        maxHealth: 100,
        invulnTimer: 0,
        characterType: 'male' 
    };

    let structures = [];
    let distantBuildings = [];
    let trees = [];
    let firstAids = [];
    let coins = [];
    let enemies = [];
    let projectiles = [];
    let enemyProjectiles = [];
    let particles = [];
    let weatherParticles = []; 
    let stars = []; 
    let shockwaves = [];
    let floatingTexts = [];
    
    let shootCooldown = 0;

    const keys = {
        ArrowLeft: false,
        ArrowRight: false,
        Space: false,
        Shoot: false
    };

    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.key === 'ArrowLeft') keys.ArrowLeft = true;
        if (e.code === 'ArrowRight' || e.key === 'ArrowRight') keys.ArrowRight = true;
        if (e.code === 'KeyZ' || e.key === 'z') keys.Shoot = true;
        if (e.code === 'Space' || e.key === ' ') {
            keys.Space = true;
            if(!isGameOver && isGameStarted) e.preventDefault(); 
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.key === 'ArrowLeft') keys.ArrowLeft = false;
        if (e.code === 'ArrowRight' || e.key === 'ArrowRight') keys.ArrowRight = false;
        if (e.code === 'KeyZ' || e.key === 'z') keys.Shoot = false;
        if (e.code === 'Space' || e.key === ' ') keys.Space = false;
    });

    function setupActionButton(btnId, keyName) {
        const btn = document.getElementById(btnId);
        const setKey = (val, e) => { keys[keyName] = val; e.preventDefault(); };
        btn.addEventListener('pointerdown', (e) => setKey(true, e));
        btn.addEventListener('pointerup', (e) => setKey(false, e));
        btn.addEventListener('pointerleave', (e) => setKey(false, e));
        btn.addEventListener('pointercancel', (e) => setKey(false, e));
    }
    setupActionButton('btnUp', 'Space');
    setupActionButton('btnShoot', 'Shoot');
    setupActionButton('btnLeft', 'ArrowLeft');
    setupActionButton('btnRight', 'ArrowRight');

    function togglePause() {
        if (!isGameStarted || isGameOver) return;
        isPaused = !isPaused;
        btnPause.innerText = isPaused ? '▶️ Play' : '⏸️ Pause';
        if (isPaused) {
            stopAllBGM();
        } else {
            startMainBGM();
        }
    }

    function spawnShockwave(x, y, color, maxRadius) {
        shockwaves.push({
            x: x, y: y,
            radius: 5,
            maxRadius: maxRadius,
            color: color,
            life: 25,
            maxLife: 25
        });
    }

    function spawnFloatingText(x, y, text, color) {
        floatingTexts.push({
            x: x, y: y,
            text: text,
            color: color,
            vy: -1.5,
            life: 40,
            maxLife: 40
        });
    }

    function buyMedkit() {
        if (coinCount >= 50 && player.health < player.maxHealth) {
            coinCount -= 50;
            player.health = Math.min(player.maxHealth, player.health + 50);
            
            playHealSound();
            spawnParticles(player.x + player.width/2, player.y + player.height/2, '#2ecc71', 40, 6);
            spawnShockwave(player.x + player.width/2, player.y + player.height/2, '#2ecc71', 60);
            spawnFloatingText(player.x, player.y - 10, '+50 HP', '#2ecc71');
        }
    }

    function buyUpgrade() {
        if (coinCount >= 50 && !hasUpgradedWeapon) {
            coinCount -= 50;
            hasUpgradedWeapon = true;
            btnUpgrade.innerText = "🔥 Maxed!";
            btnUpgrade.classList.add('disabled');
            
            playUpgradeSound();
            spawnParticles(player.x + player.width/2, player.y + player.height/2, '#f1c40f', 50, 8);
            spawnShockwave(player.x + player.width/2, player.y + player.height/2, '#f39c12', 75);
            spawnFloatingText(player.x - 25, player.y - 15, 'MAX WEAPON!', '#f1c40f');
        }
    }

    function updateShopUI() {
        if (coinCount >= 50 && player.health < player.maxHealth) {
            btnMedkit.classList.remove('disabled');
        } else {
            btnMedkit.classList.add('disabled');
        }

        if (!hasUpgradedWeapon) {
            if (coinCount >= 50) btnUpgrade.classList.remove('disabled');
            else btnUpgrade.classList.add('disabled');
        }
    }

    function checkRectCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
    }

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    for(let i=0; i<100; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2,
            opacity: Math.random()
        });
    }

    function spawnEnemy(x, y, minX, maxX) {
        let type = 'pig';
        let hp = 1;
        let w = 55;
        let h = 40;

        if (Math.random() < 0.7 || enemiesKilledCount > 5) {
            let mutantTypes = ['mutantGreen', 'mutantGreen', 'mutantDark']; 
            type = mutantTypes[Math.floor(Math.random() * mutantTypes.length)];
            hp = (type === 'mutantGreen') ? 1 : 4; 
            w = 60;
            h = 45;
        } else {
            type = 'redPig';
            hp = 2;
            w = 55;
            h = 42;
        }

        enemies.push({ 
            x: x, 
            y: y, 
            width: w, 
            height: h, 
            vx: 0, 
            vy: 0, 
            isGrounded: false, 
            facing: 'left',
            patrolMin: minX,
            patrolMax: maxX,
            enemyType: type, 
            health: hp,
            maxHealth: hp,
            hasFallenOff: false,
            shootTimer: randomInt(120, 240) 
        });
    }

    function initWorld() {
        structures = []; distantBuildings = []; trees = []; firstAids = []; enemies = []; projectiles = []; enemyProjectiles = []; coins = []; particles = []; weatherParticles = []; shockwaves = []; floatingTexts = [];
        
        let distCurrX = 0;
        while(distCurrX < canvas.width + 1200) {
            let dw = randomInt(70, 130);
            let dh = randomInt(120, 250);
            distantBuildings.push({ x: distCurrX, y: canvas.height - GROUND_HEIGHT - dh, width: dw, height: dh });
            distCurrX += dw + randomInt(60, 120);
        }

        let treeCurrX = 50;
        while(treeCurrX < canvas.width + 1500) {
            trees.push({ x: treeCurrX, y: canvas.height - GROUND_HEIGHT, width: randomInt(30, 50), height: randomInt(90, 140) });
            treeCurrX += randomInt(120, 240);
        }

        let currX = 300;
        let structureCount = 0;
        while(currX < canvas.width + 1500) {
            structureCount++;
            
            if (structureCount % 3 === 0) {
                let openGapWidth = randomInt(400, 600);
                
                let lineYGap = canvas.height - GROUND_HEIGHT - 25; 
                let startXGap = currX + 60;
                let spacingGap = 40;
                let numItemsGap = Math.floor((openGapWidth - 120) / spacingGap);
                
                for (let i = 0; i < numItemsGap; i++) {
                    if (i === Math.floor(numItemsGap / 2) && Math.random() < 0.5) {
                        firstAids.push({ x: startXGap + i * spacingGap, y: lineYGap, radius: 12, collected: false });
                    } else {
                        coins.push({ x: startXGap + i * spacingGap, y: lineYGap, radius: 10, collected: false });
                    }
                }
                
                currX += openGapWidth;
                continue;
            }

            let w = randomInt(90, 160);
            let h = randomInt(70, 200);
            let typeRand = Math.random();
            let type = typeRand < 0.33 ? 'tower' : (typeRand < 0.66 ? 'building' : 'mountain');
            
            structures.push({ x: currX, y: canvas.height - GROUND_HEIGHT - h, width: w, height: h, type: type });

            let lineYBuild = canvas.height - GROUND_HEIGHT - h - 25; 
            let startXBuild = currX + 25;
            let spacingBuild = 35;
            let numItemsBuild = Math.floor((w - 50) / spacingBuild);
            
            for (let i = 0; i <= numItemsBuild; i++) {
                if (i === Math.floor(numItemsBuild / 2) && Math.random() < 0.6) {
                        firstAids.push({ x: startXBuild + i * spacingBuild, y: lineYBuild, radius: 12, collected: false });
                } else {
                    coins.push({ x: startXBuild + i * spacingBuild, y: lineYBuild, radius: 10, collected: false });
                }
            }

            currX += w + randomInt(400, 600); 
        }
    }

    function scrollWorld(offset) {
        bgScroll += offset * 0.2;
        structures.forEach(p => p.x += offset);
        distantBuildings.forEach(db => db.x += offset * 0.4); 
        trees.forEach(t => t.x += offset * 0.7); 
        firstAids.forEach(a => a.x += offset);
        coins.forEach(c => c.x += offset);
        enemies.forEach(e => {
            e.x += offset;
            if (e.patrolMin !== undefined) { e.patrolMin += offset; e.patrolMax += offset; }
        });
        projectiles.forEach(pr => pr.x += offset);
        enemyProjectiles.forEach(epr => epr.x += offset);
        particles.forEach(pt => pt.x += offset);
        shockwaves.forEach(sw => sw.x += offset);
        floatingTexts.forEach(ft => ft.x += offset);
        if (finishLine) finishLine.x += offset;
    }

    function takeDamage(amount) {
        if (player.invulnTimer <= 0) {
            player.health -= amount;
            player.invulnTimer = 45; 
            
            spawnParticles(player.x + player.width/2, player.y + player.height/2, '#aa0000', 40, 7);
            spawnParticles(player.x + player.width/2, player.y + player.height/2, '#ff0000', 20, 5);

            if (player.health <= 0) {
                player.health = 0;
                triggerGameOver();
            }
        }
    }

    function spawnParticles(x, y, color, count, speed) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * speed,
                vy: (Math.random() - 0.5) * speed,
                life: 30, maxLife: 30,
                color: color, size: Math.random() * 4 + 2
            });
        }
    }

    function update() {
        if (!isGameStarted || isGameOver || isPaused) return;
        frames++;
        const groundY = canvas.height - GROUND_HEIGHT;

        updateShopUI();

        if (isStarting) {
            startAnimTimer--;
            if (startAnimTimer <= 0) { 
                isStarting = false;
                shopUI.style.display = 'flex';
            }
            player.vy += GRAVITY;
            player.y += player.vy;
            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }
            return; 
        }

        if (enemies.length === 0) {
            enemySpawnTimer--;
            if (enemySpawnTimer <= 0) {
                let spawnX = player.x + randomInt(400, 600);
                spawnEnemy(spawnX, -50, spawnX - 250, spawnX + 250); 
                enemySpawnTimer = 60; 
            }
        } else {
            enemySpawnTimer = 60;
        }

        let currentPhase = Math.floor(score / 300) % 3; 
        if (currentPhase === 1) { 
            for(let i=0; i<2; i++) {
                weatherParticles.push({
                    x: Math.random() * canvas.width, y: -10,
                    vx: -1, vy: randomInt(10, 15), type: 'rain', size: randomInt(10, 20) 
                });
            }
        } else if (currentPhase === 2) { 
            if (frames % 2 === 0) {
                weatherParticles.push({
                    x: Math.random() * canvas.width, y: -10,
                    vx: (Math.random() - 0.5) * 2, vy: randomInt(2, 4), type: 'snow', size: randomInt(2, 5)
                });
            }
        }

        for (let i = weatherParticles.length - 1; i >= 0; i--) {
            let wp = weatherParticles[i];
            wp.x += wp.vx; wp.y += wp.vy;
            if (wp.type === 'snow') wp.x += Math.sin(frames * 0.02 + wp.y * 0.05) * 1.5; 
            if (wp.y > canvas.height) weatherParticles.splice(i, 1);
        }

        if (player.invulnTimer > 0) player.invulnTimer--;
        if (shootCooldown > 0) shootCooldown--;

        if (keys.Shoot && shootCooldown <= 0) {
            playShootSound(); 
            projectiles.push({
                x: player.facing === 'right' ? player.x + player.width : player.x - 30,
                y: player.y + 20,
                vx: player.facing === 'right' ? 12 : -12,
                width: hasUpgradedWeapon ? 24 : 30, 
                height: hasUpgradedWeapon ? 24 : 10,
                isFireball: hasUpgradedWeapon
            });
            shootCooldown = 20; 
        }

        let isClimbing = false;

        if (keys.ArrowLeft) {
            player.vx = -player.speed;
            player.facing = 'left';
        } else if (keys.ArrowRight) {
            player.vx = player.speed;
            player.facing = 'right';
        } else {
            player.vx = 0; 
        }

        player.x += player.vx;
        
        for (let p of structures) {
            if (checkRectCollision(player, p)) {
                if (keys.ArrowRight) {
                    player.x = p.x - player.width;
                    isClimbing = true;
                }
                else if (keys.ArrowLeft) {
                    player.x = p.x + p.width;
                    isClimbing = true;
                }
            }
        }

        if (player.x > canvas.width * 0.5) {
            let offset = player.x - canvas.width * 0.5;
            player.x = canvas.width * 0.5; 
            scrollWorld(-offset);
        }
        if (player.x < 0) { player.x = 0; }

        if (isClimbing) {
            if (keys.Space) {
                player.vy = -4; 
            } else {
                player.vy = 1;  
            }
            player.isGrounded = false;
        } else {
            if (keys.Space && player.isGrounded) {
                playJumpSound(); 
                player.vy = player.jumpForce;
                player.isGrounded = false;
            }
            player.vy += GRAVITY;
        }

        player.y += player.vy;
        player.isGrounded = false; 

        if (player.y + player.height >= groundY) {
            player.y = groundY - player.height;
            player.vy = 0;
            player.isGrounded = true;
        }

        for (let p of structures) {
            if (checkRectCollision(player, p)) {
                if (player.vy >= 0) { 
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                } else if (player.vy < 0) { 
                    player.y = p.y + p.height;
                    player.vy = 0;
                }
            }
        }

        if (structures.length === 0) {
            structures.push({ x: canvas.width + 50, y: canvas.height - GROUND_HEIGHT - 120, width: 120, height: 120, type: 'building' });
        }
        let lastP = structures[structures.length - 1];
        if (lastP && lastP.x < canvas.width + 400) {
            if (frames > TIME_LIMIT_FRAMES && !finishLineSpawned) {
                let w = 250; 
                let gap = randomInt(400, 600); 
                let h = 180;
                let newX = lastP.x + lastP.width + gap;
                let newY = canvas.height - GROUND_HEIGHT - h;

                structures.push({ x: newX, y: newY, width: w, height: h, type: 'building' });
                finishLine = { x: newX + w/2, y: newY, width: 45, height: 100 };
                finishLineSpawned = true;
            } else if (!finishLineSpawned) {
                let w = randomInt(90, 160);
                let h = randomInt(70, 200);
                let gap = randomInt(400, 600); 
                let newX = lastP.x + lastP.width + gap;
                let newY = canvas.height - GROUND_HEIGHT - h;

                let typeRand = Math.random();
                let type = typeRand < 0.33 ? 'tower' : (typeRand < 0.66 ? 'building' : 'mountain');
                structures.push({ x: newX, y: newY, width: w, height: h, type: type });

                let lineYBuild = newY - 25; 
                let startXBuild = newX + 25;
                let spacingBuild = 35;
                let numItemsBuild = Math.floor((w - 50) / spacingBuild);
                
                for (let i = 0; i <= numItemsBuild; i++) {
                    if (i === Math.floor(numItemsBuild / 2) && Math.random() < 0.6) {
                        firstAids.push({ x: startXBuild + i * spacingBuild, y: lineYBuild, radius: 12, collected: false });
                    } else {
                        coins.push({ x: startXBuild + i * spacingBuild, y: lineYBuild, radius: 10, collected: false });
                    }
                }

                let lineYGap = canvas.height - GROUND_HEIGHT - 25;
                let startXGap = lastP.x + lastP.width + 50;
                let spacingGap = 40;
                let numItemsGap = Math.floor((gap - 100) / spacingGap);
                
                for (let i = 0; i < numItemsGap; i++) {
                    if (i === Math.floor(numItemsGap / 2) && Math.random() < 0.5) {
                        firstAids.push({ x: startXGap + i * spacingGap, y: lineYGap, radius: 12, collected: false });
                    } else {
                        coins.push({ x: startXGap + i * spacingGap, y: lineYGap, radius: 10, collected: false });
                    }
                }
            }
        }

        let lastDB = distantBuildings[distantBuildings.length - 1];
        if (lastDB && lastDB.x < canvas.width + 1000) {
            let dw = randomInt(70, 130);
            let dh = randomInt(120, 250);
            let dx = lastDB.x + lastDB.width + randomInt(60, 120);
            distantBuildings.push({ x: dx, y: canvas.height - GROUND_HEIGHT - dh, width: dw, height: dh });
        }

        let lastTree = trees[trees.length - 1];
        if (lastTree && lastTree.x < canvas.width + 1000) {
            trees.push({
                x: lastTree.x + randomInt(120, 240), y: canvas.height - GROUND_HEIGHT,
                width: randomInt(30, 50), height: randomInt(90, 140)
            });
        }

        for (let i = structures.length - 1; i >= 0; i--) {
            if (structures[i].x + structures[i].width < -500) structures.splice(i, 1); 
        }
        for (let i = distantBuildings.length - 1; i >= 0; i--) {
            if (distantBuildings[i].x + distantBuildings[i].width < -500) distantBuildings.splice(i, 1); 
        }
        for (let i = trees.length - 1; i >= 0; i--) {
            if (trees[i].x + trees[i].width < -500) trees.splice(i, 1); 
        }

        if (finishLineSpawned && finishLine) {
            let flagRect = {
                x: finishLine.x, y: finishLine.y - finishLine.height,
                width: finishLine.width, height: finishLine.height
            };
            if (checkRectCollision(player, flagRect)) triggerWin();
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let dx = (player.x + player.width/2) - (e.x + e.width/2);
            
            let minX = Math.min(player.x, e.x);
            let maxX = Math.max(player.x, e.x);
            let buildingInBetween = false;
            for (let p of structures) {
                if (p.x + p.width > minX && p.x < maxX) {
                    buildingInBetween = true;
                    break;
                }
            }

            if (e.hasFallenOff) {
                e.patrolMin = -500;
                e.patrolMax = canvas.width + 1000;
                if (!buildingInBetween && Math.abs(dx) < 500) {
                    e.vx = dx > 0 ? 1.6 : -1.6;
                    e.facing = dx > 0 ? 'right' : 'left';
                } else {
                    e.vx = 0;
                }
            } else {
                if (!buildingInBetween && Math.abs(dx) < 600) {
                    e.vx = dx > 0 ? 1.8 : -1.8;
                    e.facing = dx > 0 ? 'right' : 'left';
                } else {
                    if (e.patrolMin !== undefined && e.patrolMax !== undefined) {
                        if (e.dir === undefined) e.dir = 1;
                        e.vx = e.dir * 1.4;
                        e.facing = e.dir > 0 ? 'right' : 'left';
                        if (e.x <= e.patrolMin) e.dir = 1;
                        else if (e.x + e.width >= e.patrolMax) e.dir = -1;
                    } else {
                        e.vx = 0;
                    }
                }
            }

            e.x += e.vx;

            for (let p of structures) {
                if (checkRectCollision(e, p)) {
                    if (e.vx > 0 && e.x + e.width - e.vx <= p.x) { 
                        e.x = p.x - e.width; e.vx = 0;
                        if (e.dir) e.dir *= -1;
                    } else if (e.vx < 0 && e.x - e.vx >= p.x + p.width) {
                        e.x = p.x + p.width; e.vx = 0;
                        if (e.dir) e.dir *= -1;
                    }
                }
            }

            if (!e.hasFallenOff && e.patrolMin !== undefined && e.patrolMax !== undefined) {
                if (e.x < e.patrolMin || e.x + e.width > e.patrolMax) {
                    e.hasFallenOff = true;
                }
            }

            if (['mutantGreen', 'mutantDark'].includes(e.enemyType)) {
                e.shootTimer--;
                if (e.shootTimer <= 0 && Math.abs(dx) < 400 && !buildingInBetween) {
                    let fVx = e.facing === 'right' ? 3.5 : -3.5; 
                    enemyProjectiles.push({
                        x: e.facing === 'right' ? e.x + e.width : e.x - 20,
                        y: e.y + e.height / 2,
                        vx: fVx,
                        width: 15,
                        height: 15
                    });
                    e.shootTimer = randomInt(150, 280);
                }
            }

            e.vy += GRAVITY;
            e.y += e.vy;
            e.isGrounded = false;

            if (e.y + e.height >= groundY) {
                e.y = groundY - e.height;
                e.vy = 0;
                e.isGrounded = true;
                e.hasFallenOff = true; 
            }

            for (let p of structures) {
                if (checkRectCollision(e, p)) {
                    if (e.vy >= 0) { 
                        if (e.y + e.height - e.vy <= p.y + 15) {
                            e.y = p.y - e.height;
                            e.vy = 0;
                            e.isGrounded = true;
                        }
                    }
                }
            }

            if (checkRectCollision(player, e)) takeDamage(30);
            if (e.x + e.width < -500 || e.x > canvas.width + 1000) enemies.splice(i, 1);
        }

        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
            let epr = enemyProjectiles[i];
            epr.x += epr.vx;
            
            if(frames % 3 === 0) spawnParticles(epr.x + epr.width/2, epr.y + epr.height/2, '#2ecc71', 1, 2);

            let hitWall = false;
            for (let p of structures) {
                if (checkRectCollision(epr, p)) { hitWall = true; break; }
            }

            if (checkRectCollision(epr, player)) {
                takeDamage(15); 
                spawnParticles(player.x + player.width/2, player.y + player.height/2, '#2ecc71', 12, 5); 
                enemyProjectiles.splice(i, 1);
                continue;
            }

            if (hitWall || epr.x > canvas.width || epr.x < 0) {
                spawnParticles(epr.x, epr.y, '#27ae60', 5, 2);
                enemyProjectiles.splice(i, 1);
            }
        }

        for (let i = projectiles.length - 1; i >= 0; i--) {
            let pr = projectiles[i];
            pr.x += pr.vx;

            let hit = false;
            let hitWall = false;

            for (let p of structures) {
                if (checkRectCollision(pr, p)) { hitWall = true; break; }
            }

            if (!hitWall) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (checkRectCollision(pr, enemies[j])) {
                        let targetEnemy = enemies[j];
                        
                        if (pr.isFireball) {
                            targetEnemy.health = 0;
                        } else {
                            targetEnemy.health--;
                        }
                        
                        let colorHit = targetEnemy.enemyType === 'mutantGreen' ? '#117a65' : (targetEnemy.enemyType === 'mutantDark' ? '#512e5f' : '#c0392b');
                        spawnParticles(targetEnemy.x + targetEnemy.width/2, targetEnemy.y + targetEnemy.height/2, colorHit, 15, 5);

                        if (targetEnemy.health <= 0) {
                            playKillSound(); 
                            spawnParticles(targetEnemy.x + targetEnemy.width/2, targetEnemy.y + targetEnemy.height/2, colorHit, 25, 6);
                            
                            let pts = ['mutantGreen', 'mutantDark'].includes(targetEnemy.enemyType) ? 50 : 25;
                            spawnFloatingText(targetEnemy.x, targetEnemy.y, '+' + pts, '#ffd700');
                            
                            enemies.splice(j, 1); 
                            score += pts; 
                            enemiesKilledCount++;
                        }
                        hit = true;
                        break;
                    }
                }
            }
            
            if (hit || hitWall || pr.x > canvas.width || pr.x < 0) {
                projectiles.splice(i, 1);
            }
        }

        for (let i = firstAids.length - 1; i >= 0; i--) {
            let a = firstAids[i];
            let distX = a.x - Math.max(player.x, Math.min(a.x, player.x + player.width));
            let distY = a.y - Math.max(player.y, Math.min(a.y, player.y + player.height));
            if (Math.sqrt((distX * distX) + (distY * distY)) <= a.radius + 10) {
                player.health = Math.min(player.maxHealth, player.health + 20); 
                playHealSound();
                spawnParticles(player.x + player.width/2, player.y + player.height/2, '#2ecc71', 25, 5);
                spawnShockwave(player.x + player.width/2, player.y + player.height/2, '#2ecc71', 40);
                spawnFloatingText(player.x, player.y - 10, '+20 HP', '#2ecc71');
                firstAids.splice(i, 1);
            } else if (a.x < -500) firstAids.splice(i, 1);
        }

        for (let i = coins.length - 1; i >= 0; i--) {
            let c = coins[i];
            let distX = c.x - Math.max(player.x, Math.min(c.x, player.x + player.width));
            let distY = c.y - Math.max(player.y, Math.min(c.y, player.y + player.height));
            if (Math.sqrt((distX * distX) + (distY * distY)) <= c.radius) {
                coinCount++;
                score += 5; 
                playCoinSound(); // TRIGGER COIN COLLECTION SOUND
                spawnParticles(c.x, c.y, '#f1c40f', 15, 5);
                coins.splice(i, 1);
            } else if (c.x < -500) coins.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let pt = particles[i];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.vy += GRAVITY * 0.5;
            pt.life--;
            if (pt.life <= 0) particles.splice(i, 1);
        }

        for (let i = shockwaves.length - 1; i >= 0; i--) {
            let sw = shockwaves[i];
            sw.radius += (sw.maxRadius - sw.radius) * 0.2;
            sw.life--;
            if (sw.life <= 0) shockwaves.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y += ft.vy;
            ft.life--;
            if (ft.life <= 0) floatingTexts.splice(i, 1);
        }
    }

    function drawBackgroundMountain(peakX, peakY, baseWidth, color) {
        const groundY = canvas.height - GROUND_HEIGHT;
        ctx.beginPath();
        ctx.moveTo(peakX, peakY);
        ctx.lineTo(peakX - baseWidth/2, groundY);
        ctx.lineTo(peakX + baseWidth/2, groundY);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.closePath();
        
        let capColor = '#ffffff';
        const capHeight = (groundY - peakY) * 0.45; 
        const capBaseWidth = baseWidth * 0.45;
        
        ctx.beginPath();
        ctx.moveTo(peakX, peakY);
        ctx.lineTo(peakX - capBaseWidth/2, peakY + capHeight);
        ctx.lineTo(peakX - capBaseWidth/4, peakY + capHeight - 15);
        ctx.lineTo(peakX, peakY + capHeight + 5);
        ctx.lineTo(peakX + capBaseWidth/4, peakY + capHeight - 10);
        ctx.lineTo(peakX + capBaseWidth/2, peakY + capHeight);
        ctx.fillStyle = capColor;
        ctx.fill();
        ctx.closePath();
    }

    function drawBackground() {
        let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGradient.addColorStop(0, '#1a0000'); 
        skyGradient.addColorStop(0.5, '#4a1515'); 
        skyGradient.addColorStop(1, '#2c0b0b');  
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        for(let s of stars) {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
            ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(680, 140, 55, 0, Math.PI * 2);
        ctx.fillStyle = '#ff3838'; 
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 50; 
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0; 

        ctx.fillStyle = '#3d2323';
        for (let db of distantBuildings) {
            ctx.fillRect(db.x, db.y, db.width, db.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(db.x, db.y, db.width, 15);
            ctx.fillStyle = '#3d2323';
        }

        let m = [
            {x: 200, y: 150, w: 500, r: 90, g: 50, b: 50}, 
            {x: 700, y: 200, w: 600, r: 90, g: 50, b: 50}, 
            {x: 1200, y: 170, w: 550, r: 90, g: 50, b: 50}, 
            {x: 450, y: 280, w: 550, r: 60, g: 30, b: 30}, 
            {x: 100, y: 350, w: 400, r: 60, g: 30, b: 30},
            {x: 950, y: 320, w: 450, r: 60, g: 30, b: 30}
        ];

        for (let i = 0; i < m.length; i++) {
            let drawX = m[i].x + (bgScroll % 1600); 
            if (drawX > 1600) drawX -= 1600; 
            if (drawX < -400) drawX += 1600; 
            let c = `rgb(${m[i].r}, ${m[i].g}, ${m[i].b})`;
            drawBackgroundMountain(drawX, m[i].y, m[i].w, c);
        }

        for (let t of trees) {
            ctx.fillStyle = '#1e100c';
            ctx.fillRect(t.x + t.width/2 - 5, t.y - t.height * 0.4, 10, t.height * 0.4);
            ctx.fillStyle = '#1b3b22';
            ctx.beginPath();
            ctx.moveTo(t.x + t.width/2, t.y - t.height);
            ctx.lineTo(t.x, t.y - t.height * 0.3);
            ctx.lineTo(t.x + t.width, t.y - t.height * 0.3);
            ctx.fill();
            ctx.closePath();
            
            ctx.fillStyle = '#142918';
            ctx.beginPath();
            ctx.moveTo(t.x + t.width/2, t.y - t.height * 0.6);
            ctx.lineTo(t.x - 5, t.y - t.height * 0.15);
            ctx.lineTo(t.x + t.width + 5, t.y - t.height * 0.15);
            ctx.fill();
            ctx.closePath();
        }
    }

    function drawZombifiedPig(x, y, w, h, facing, enemyType) {
        ctx.save();
        if (facing === 'right') {
            ctx.translate(x + w/2, 0); ctx.scale(-1, 1); ctx.translate(-(x + w/2), 0);
        }

        if (enemyType === 'mutantGreen') {
            ctx.fillStyle = '#117a65';
            ctx.fillRect(x, y + 6, w, h - 6);
            ctx.fillStyle = '#148f77'; 
            ctx.fillRect(x + 8, y + 12, w - 16, 10);
            ctx.fillStyle = '#0e6251'; 
            ctx.fillRect(x - 8, y + h/2 - 6, 12, 16); 
            ctx.fillStyle = '#2ecc71'; 
            ctx.fillRect(x + 12, y + 4, 6, 4); 
        } else if (enemyType === 'mutantDark') {
            ctx.fillStyle = '#512e5f';
            ctx.fillRect(x, y + 8, w, h - 8);
            ctx.fillStyle = '#212f3d'; 
            ctx.fillRect(x + 8, y, w - 16, 12);
            ctx.fillStyle = '#4a235a'; 
            ctx.fillRect(x - 8, y + h/2 - 6, 12, 16); 
            ctx.fillStyle = '#2ecc71'; 
            ctx.fillRect(x + 12, y + 4, 6, 4); 
        } else {
            let isRed = (enemyType === 'redPig');
            ctx.fillStyle = isRed ? '#c0392b' : '#e67e22'; 
            ctx.fillRect(x, y + 8, w, h - 8);
            ctx.fillStyle = isRed ? '#78281f' : '#d35400';
            ctx.fillRect(x + 10, y + 4, w - 20, 10);
            ctx.fillStyle = isRed ? '#922b21' : '#b9770e';
            ctx.fillRect(x - 8, y + h/2 - 6, 12, 16); 
            ctx.fillStyle = '#ffcc00'; 
            ctx.fillRect(x + 4, y + 12, 6, 4); 
        }

        ctx.fillStyle = '#ecf0f1';
        ctx.beginPath();
        ctx.moveTo(x - 8, y + h/2 + 6);
        ctx.lineTo(x - 14, y + h/2 + 2);
        ctx.lineTo(x - 8, y + h/2 + 2);
        ctx.fill();
        ctx.closePath();

        ctx.fillStyle = '#1e272e'; 
        ctx.fillRect(x + 6, y + h, 8, 8); 
        ctx.fillRect(x + w - 14, y + h, 8, 8);

        ctx.restore();
    }

    function drawPlayerProjectile(pr) {
        ctx.save();
        if (pr.isFireball) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#e74c3c';
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(pr.x + pr.width/2, pr.y + pr.height/2, 12, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            let trailDir = pr.vx > 0 ? -4 : 4;
            ctx.arc(pr.x + pr.width/2 + trailDir, pr.y + pr.height/2, 6, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.shadowBlur = 10; 
            ctx.shadowColor = '#f1c40f'; 
            ctx.strokeStyle = '#f1c40f'; 
            ctx.lineWidth = 4;
            ctx.beginPath(); 
            ctx.moveTo(pr.x, pr.y + pr.height/2);
            let dir = pr.vx > 0 ? 1 : -1;
            ctx.lineTo(pr.x + 10 * dir, pr.y);
            ctx.lineTo(pr.x + 15 * dir, pr.y + pr.height);
            ctx.lineTo(pr.x + 30 * dir, pr.y + pr.height/2);
            ctx.stroke(); 
        }
        ctx.restore();
    }

    function drawEnemyFireball(epr) {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#27ae60';
        ctx.fillStyle = '#2ecc71';
        ctx.beginPath();
        ctx.arc(epr.x + epr.width/2, epr.y + epr.height/2, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();

        for (let p of structures) {
            if (p.type === 'tower') {
                ctx.fillStyle = '#2ecc71'; 
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(p.x + p.width - 15, p.y, 15, p.height); 
                
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(p.x - 5, p.y, p.width + 10, 20);
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(p.x - 5, p.y, p.width + 10, 6);

                ctx.strokeStyle = '#1e8449';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x - 5, p.y, p.width + 10, 20);
                ctx.strokeRect(p.x, p.y + 20, p.width, p.height - 20);
                
            } else if (p.type === 'building') {
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#1a252f';
                ctx.fillRect(p.x + p.width - 20, p.y, 20, p.height); 
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(p.x, p.y, p.width, 12);

                ctx.fillStyle = '#f1c40f';
                for(let wy = p.y + 22; wy < p.y + p.height - 20; wy += 35) {
                    for(let wx = p.x + 15; wx < p.x + p.width - 20; wx += 25) {
                        if (Math.random() > 0.05) { 
                            ctx.fillRect(wx, wy, 12, 18);
                        }
                    }
                }
            } else if (p.type === 'mountain') {
                ctx.fillStyle = '#8e44ad';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#732d91';
                ctx.fillRect(p.x + p.width - 25, p.y, 25, p.height); 
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(p.x, p.y, p.width, 30);
                
                ctx.beginPath();
                ctx.moveTo(p.x, p.y + 30);
                ctx.lineTo(p.x + 15, p.y + 45);
                ctx.lineTo(p.x + 35, p.y + 30);
                ctx.lineTo(p.x + 55, p.y + 50);
                ctx.lineTo(p.x + 75, p.y + 30);
                if (p.width > 75) ctx.lineTo(p.x + p.width, p.y + 30);
                ctx.fill();
                ctx.closePath();
            }
        }

        const groundY = canvas.height - GROUND_HEIGHT;
        ctx.fillStyle = '#8B4513'; 
        ctx.fillRect(0, groundY, canvas.width, GROUND_HEIGHT);
        
        ctx.fillStyle = '#ffffff'; 
        ctx.fillRect(0, groundY, canvas.width, 12);
        
        ctx.fillStyle = '#b2bec3';
        for(let i = -10; i < 20; i++) {
            let dashX = (i * 50 + bgScroll % 50);
            ctx.fillRect(dashX, groundY + 16, 20, 4);
        }

        if (finishLine) {
            ctx.save();
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(finishLine.x, finishLine.y - finishLine.height, 6, finishLine.height);
            ctx.fillStyle = '#f1c40f';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f39c12';
            ctx.beginPath();
            ctx.moveTo(finishLine.x + 6, finishLine.y - finishLine.height);
            ctx.lineTo(finishLine.x + 45, finishLine.y - finishLine.height + 25);
            ctx.lineTo(finishLine.x + 6, finishLine.y - finishLine.height + 50);
            ctx.fill();
            ctx.closePath();
            ctx.restore();
        }

        for (let a of firstAids) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(a.x - 12, a.y - 12, 24, 24); 
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(a.x - 4, a.y - 9, 8, 18); 
            ctx.fillRect(a.x - 9, a.y - 4, 18, 8); 
        }

        for (let c of coins) {
            ctx.save();
            ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#f1c40f'; ctx.shadowBlur = 10; ctx.shadowColor = '#f39c12';
            ctx.fill(); ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 2; ctx.stroke(); ctx.closePath();
            ctx.restore();
        }

        for (let pt of particles) {
            ctx.save();
            ctx.globalAlpha = pt.life / pt.maxLife;
            ctx.fillStyle = pt.color; ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
            ctx.restore();
        }

        for (let sw of shockwaves) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
            ctx.strokeStyle = sw.color;
            ctx.lineWidth = 4;
            ctx.globalAlpha = sw.life / sw.maxLife;
            ctx.stroke();
            ctx.restore();
        }

        for (let ft of floatingTexts) {
            ctx.save();
            ctx.globalAlpha = ft.life / ft.maxLife;
            ctx.fillStyle = ft.color;
            ctx.font = 'bold 20px sans-serif';
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000000';
            ctx.strokeText(ft.text, ft.x, ft.y);
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }

        for (let e of enemies) {
            drawZombifiedPig(e.x, e.y, e.width, e.height, e.facing, e.enemyType);
        }
        for (let pr of projectiles) {
            drawPlayerProjectile(pr);
        }
        for (let epr of enemyProjectiles) {
            drawEnemyFireball(epr);
        }

        if (player.invulnTimer % 10 < 5) {
            ctx.save();
            if (hasUpgradedWeapon) {
                ctx.shadowColor = '#f39c12';
                ctx.shadowBlur = 20 + Math.sin(frames * 0.15) * 10;
            }

            if (player.characterType === 'female') {
                drawFemaleWarrior(ctx, player.x, player.y, player.width, player.height, player.facing);
            } else {
                drawHeroicWarrior(ctx, player.x, player.y, player.width, player.height, player.facing);
            }
            ctx.restore();
        }

        ctx.fillStyle = '#2c3e50'; 
        ctx.font = 'bold 24px sans-serif';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeText('Score: ' + score, 20, 40); ctx.fillText('Score: ' + score, 20, 40);

        ctx.font = 'bold 24px sans-serif';
        ctx.strokeText('HP:', 20, 80); ctx.fillText('HP:', 20, 80);
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(70, 60, 200, 24);
        ctx.fillStyle = '#2ecc71'; ctx.fillRect(70, 60, (player.health / player.maxHealth) * 200, 24);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(70, 60, 200, 24);

        ctx.fillStyle = '#f1c40f';
        ctx.beginPath(); ctx.arc(canvas.width - 90, 32, 12, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 2; ctx.stroke(); ctx.closePath();
        ctx.fillStyle = '#2c3e50'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
        ctx.strokeText('x ' + coinCount, canvas.width - 70, 40); ctx.fillText('x ' + coinCount, canvas.width - 70, 40);

        if (isPaused) {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f1c40f'; 
            ctx.font = 'bold 60px sans-serif';
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 4; 
            ctx.strokeStyle = '#2c3e50';
            ctx.strokeText('PAUSED', canvas.width / 2, canvas.height / 2);
            ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }

        if (isStarting && !isPaused) {
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            let progress = 1 - (startAnimTimer / 60); 
            let scale = 0.5 + (progress * 2);
            let alpha = 1 - progress;
            ctx.scale(scale, scale); ctx.globalAlpha = alpha;
            ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 60px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 4; ctx.strokeStyle = '#2c3e50';
            ctx.strokeText('FIGHT!', 0, 0); ctx.fillText('FIGHT!', 0, 0);
            ctx.restore();
        }
    }

    function startGame(charType = 'male') {
        player.characterType = charType;
        
        startScreen.style.display = 'none';
        isGameStarted = true;
        isPaused = false;
        
        btnPause.style.display = 'block';
        btnPause.innerText = '⏸️ Pause';

        player.x = 100; player.y = 50; player.vx = 0; player.vy = 0;
        player.health = 100; player.invulnTimer = 0; player.facing = 'right';
        
        hasUpgradedWeapon = false;
        btnUpgrade.innerText = "🔥 Upgrade (50)";
        btnUpgrade.classList.remove('disabled');

        initWorld();
        score = 0; coinCount = 0; enemiesKilledCount = 0; bgScroll = 0; shootCooldown = 0; frames = 0;
        finishLineSpawned = false; finishLine = null;
        isStarting = true; startAnimTimer = 60; enemySpawnTimer = 60;
        gameOverUI.style.display = 'none'; isGameOver = false;
        shopUI.style.display = 'none';

        startMainBGM();
    }

    function triggerGameOver() {
        isGameOver = true;
        stopAllBGM();
        playDefeatSound();
        
        btnPause.style.display = 'none';
        gameOverTitle.innerText = 'Game Over!';
        gameOverTitle.style.color = '#ff4757';
        document.getElementById('heroQuote').innerText = "It's not the end until you quit";
        document.getElementById('heroQuote').style.color = '#f1c40f';
        gameOverUI.style.display = 'flex';
        shopUI.style.display = 'none';
    }

    function triggerWin() {
        isGameOver = true;
        stopAllBGM();
        playVictoryBGM();
        
        btnPause.style.display = 'none';
        gameOverTitle.innerText = 'Victory!';
        gameOverTitle.style.color = '#f1c40f';
        document.getElementById('heroQuote').innerText = '✨ You are a true warrior! ✨';
        
        gameOverUI.style.display = 'flex';
        shopUI.style.display = 'none';
        
        for(let i = 0; i < 40; i++) {
            let spark = document.createElement('div');
            spark.className = 'sparkle';
            spark.innerHTML = '✨';
            spark.style.left = Math.random() * 100 + '%';
            spark.style.top = Math.random() * 100 + '%';
            spark.style.animationDelay = (Math.random() * 2) + 's';
            gameOverUI.appendChild(spark);
        }
    }

    function goToCharacterSelect() {
        document.querySelectorAll('.sparkle').forEach(el => el.remove());
        isGameOver = false; 
        isGameStarted = false; 
        btnPause.style.display = 'none';
        gameOverUI.style.display = 'none';
        startScreen.style.display = 'flex';
        
        stopAllBGM();
        startMenuBGM();
    }

    function restartGame() {
        document.querySelectorAll('.sparkle').forEach(el => el.remove());
        startGame(player.characterType);
    }

    function drawPreviews() {
        const mCanvas = document.getElementById('previewMale');
        const mCtx = mCanvas.getContext('2d');
        drawHeroicWarrior(mCtx, 18, 8, 24, 48, 'right');

        const fCanvas = document.getElementById('previewFemale');
        const fCtx = fCanvas.getContext('2d');
        drawFemaleWarrior(fCtx, 18, 8, 24, 48, 'right');
    }
    drawPreviews();

    function gameLoop() {
        update();
        draw();
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    gameLoopId = requestAnimationFrame(gameLoop);
</script>
</body>
</html>
